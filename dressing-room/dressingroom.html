<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17121f">
  <title>Vestidor mágico | Casa-Lumi</title>
  <link rel="stylesheet" href="vestidor.css">
<script src="vestidor.js" defer></script>
</head>
<body>
  <main class="vestidor" id="vestidor-lumi">
    <a class="volver" href="../index.html">← Volver a Casa-Lumi</a>
    <h1>☾ Mi Vestidor Mágico 2D</h1>
    <p>Elige una estación o celebración 💜</p>
    <section class="escenario" aria-label="Vista previa del personaje">
      <img id="lumi-imagen" src="invierno.webp" alt="Lumi con vestuario de invierno">
      <span class="destellos" aria-hidden="true">✦ ✧ ✦</span>
    </section>
    <h2 id="lumi-titulo">Invierno</h2>
    <p id="lumi-descripcion" aria-live="polite">Selecciona un vestuario para Lumi.</p>
    <div class="opciones" id="lumi-opciones" aria-label="Vestuario de Lumi">
      <button type="button" data-ropa="invierno">❄️ Invierno</button>
      <button type="button" data-ropa="verano">☀️ Verano</button>
      <button type="button" data-ropa="otono">🍂 Otoño</button>
      <button type="button" data-ropa="primavera">🌸 Primavera</button>
      <button type="button" data-ropa="navidad">🎄 Navidad</button>
      <button type="button" data-ropa="año-nuevo">✨ Año Nuevo</button>
      <button type="button" data-ropa="fiestas-patrias">🇨🇱 Fiestas Patrias</button>
      <button type="button" data-ropa="san-valentin">💗 San Valentín</button>
      <button type="button" data-ropa="pijama-invierno">🌙 Pijama invierno</button>
      <button type="button" data-ropa="pijama-verano">⭐ Pijama verano</button>
    </div>
    <p class="nota">Los archivos de imagen deben estar en esta misma carpeta. Para animar a Lumi por partes, después usaremos capas transparentes.</p>
  </main>
</body>
</html>
